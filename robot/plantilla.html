<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1d2330;--muted:#6b7280;--line:#e3e6eb;--accent:#1f6feb;--warn:#d1242f;--ok:#1a7f37}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--panel:#171b23;--ink:#e6e9ef;--muted:#9aa3b2;--line:#2a303b;--accent:#4c8dff;--warn:#ff6b6b;--ok:#3fb950}}
:root[data-theme="dark"]{--bg:#0f1218;--panel:#171b23;--ink:#e6e9ef;--muted:#9aa3b2;--line:#2a303b;--accent:#4c8dff;--warn:#ff6b6b;--ok:#3fb950}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:grid;grid-template-columns:360px 1fr;grid-template-rows:auto 1fr;height:100vh}
header{grid-column:1/3;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0 8px 0 0;font-weight:650}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;text-align:left}
.tab small{display:block;color:var(--muted);font-size:11px}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}.tab.on small{color:#dbe7ff}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 10px;border-radius:8px;cursor:pointer;font:inherit}
.btn.arm{background:#fff4d6;border-color:#d4a72c;color:#5c4400}
aside{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:12px}
#map{height:100%;width:100%}
.buscar{position:sticky;top:0;z-index:5;background:var(--panel);padding-bottom:10px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.buscar label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.buscar input{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.buscar input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.res{list-style:none;margin:6px 0 0;padding:0;max-height:300px;overflow:auto}
.res li{display:grid;grid-template-columns:12px 1fr;gap:8px;align-items:start;padding:6px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.res li:hover,.res li:focus{background:color-mix(in srgb,var(--accent) 10%,transparent);outline:none}
.res li .sw{width:12px;height:12px;border-radius:50%;margin-top:3px}
.res small{color:var(--muted)}
.res .dir{color:var(--accent)}
.res .vacio{display:block;color:var(--muted);cursor:default;padding:6px 4px}
.pulso{border-radius:50%;border:3px solid #d93025;animation:pulso 1.2s ease-out 4}
@keyframes pulso{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulso{animation:none}}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:6px 8px}.kpi b{display:block;font-size:18px}.kpi span{color:var(--muted);font-size:11px}
.vrow{display:grid;grid-template-columns:18px 14px 1fr auto;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.vrow:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.vrow.sel{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.sw{width:14px;height:14px;border-radius:4px}
.vrow .meta{color:var(--muted);font-size:12px;text-align:right;white-space:nowrap}
.warn{color:var(--warn)}
h3{font-size:13px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
ol.seq{margin:0;padding-left:0;list-style:none}
ol.seq li{display:grid;grid-template-columns:28px 1fr;gap:6px;padding:6px 0;border-bottom:1px dashed var(--line);cursor:pointer}
ol.seq li .n{width:14px;height:14px;margin-top:3px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
ol.seq li small{color:var(--muted)}
.pin{border-radius:50%;color:#fff;font:700 10px/1 system-ui;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.pin.reub{border:2px dashed #111;}
.pin.rev{border:3px solid #d1242f}
.depot{font-size:22px;line-height:1;text-shadow:0 0 3px #fff}
.legend{font-size:12px;color:var(--muted);margin-top:8px;display:grid;gap:4px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-3px;margin-right:6px;background:#888}
.hint{font-size:12px;color:var(--muted);margin:6px 0}
@media (max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:auto 45vh 1fr}aside{order:3;border-right:0}header{grid-column:1}#map{min-height:45vh}}
.leaflet-container{background:#eceef1;--ps:1}
.place span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font:500 calc(var(--ps)*10px)/1 Roboto,Arial,"Segoe UI",sans-serif;color:#8a8f96;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 1px #fff;letter-spacing:.02em}
.place.rk0 span{font-size:calc(var(--ps)*12px);font-weight:600;color:#7a7f86}.place.rk1 span{font-size:calc(var(--ps)*11px);color:#868b92}.place.rk3 span{font-size:calc(var(--ps)*9.5px);color:#9aa0a6}

<script>
// Fondo de mapa estilo Google, dibujado en la página con datos © OpenStreetMap (ODbL).
const BASE = /*BASE*/;
const MAPC = { land: "#eceef1", water: "#aadaff", park: "#c6e8c1", street: "#ffffff", streetEdge: "#d3d6db",
  arterial: "#ffffff", arterialEdge: "#c2c6cc", avenue: "#fde293", avenueEdge: "#f2c94c", highway: "#f8c967", highwayEdge: "#e0a83c",
  rail: "#b3b8bf", river: "#aadaff", text: "#5f6368", textStrong: "#3c4043", halo: "#ffffff" };
const BM = (() => {
  const CELL = 0.02;
  const dec = s => { const a = s.split(",").map(Number), p = new Float64Array(a.length); let la = 0, lo = 0;
    for (let i = 0; i < a.length; i += 2) { la += a[i]; lo += a[i + 1]; p[i] = la / 1e5; p[i + 1] = lo / 1e5; } return p; };
  const index = (items) => { const grid = new Map();
    items.forEach((it, id) => { const p = it.pts; let a = 90, b = -90, c = 180, d = -180;
      for (let i = 0; i < p.length; i += 2) { if (p[i] < a) a = p[i]; if (p[i] > b) b = p[i]; if (p[i + 1] < c) c = p[i + 1]; if (p[i + 1] > d) d = p[i + 1]; }
      for (let i = Math.floor(a / CELL); i <= Math.floor(b / CELL); i++) for (let j = Math.floor(c / CELL); j <= Math.floor(d / CELL); j++) {
        const k = i + "," + j; if (!grid.has(k)) grid.set(k, []); grid.get(k).push(id); } });
    return { items, grid }; };
  const roads = index(BASE.roads.map(([c, n, s]) => ({ c, n: n >= 0 ? BASE.names[n] : "", pts: dec(s) })));
  const parks = index((BASE.park || []).map(s => ({ pts: dec(s) })));
  const waters = index((BASE.water || []).map(s => ({ pts: dec(s) })));
  const rivers = index((BASE.river || []).map(([w, s]) => ({ w, pts: dec(s) })));
  const rail = index(BASE.rail.map(s => ({ pts: dec(s) })));
  // Río de la Plata: costa principal cerrada hacia el este
  const coast = (BASE.coast || []).map(dec); let sea = null, islands = [];
  if (coast.length) { const m = coast[0], n = m.length; const ext = [m[n - 2] + 0.25, m[n - 1], -34.30, -57.40, -35.10, -57.40, m[0] - 0.1, m[1] + 0.05];
    sea = new Float64Array(n + ext.length); sea.set(m); sea.set(ext, n); islands = coast.slice(1); }
  return { CELL, roads, parks, waters, rivers, rail, sea, islands };
})();
const StreetLayer = L.GridLayer.extend({
  createTile(coords) {
    const t = document.createElement("canvas"), dpr = Math.min(window.devicePixelRatio || 1, 2), S = 256;
    t.width = S * dpr; t.height = S * dpr; const ctx = t.getContext("2d"); ctx.scale(dpr, dpr);
    const z = coords.z, W = 256 * Math.pow(2, z), ox = coords.x * S, oy = coords.y * S, C = MAPC;
    const px = lo => (lo + 180) / 360 * W - ox;
    const py = la => { const s = Math.sin(la * Math.PI / 180); return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * W - oy; };
    const nw = this._map.unproject([ox - 24, oy - 24], z), se = this._map.unproject([ox + S + 24, oy + S + 24], z);
    const pick = ix => { const ids = new Set();
      for (let i = Math.floor(se.lat / BM.CELL); i <= Math.floor(nw.lat / BM.CELL); i++)
        for (let j = Math.floor(nw.lng / BM.CELL); j <= Math.floor(se.lng / BM.CELL); j++) { const a = ix.grid.get(i + "," + j); if (a) for (const id of a) ids.add(id); }
      return [...ids].map(i => ix.items[i]); };
    const trace = p => { ctx.beginPath(); ctx.moveTo(px(p[1]), py(p[0])); for (let i = 2; i < p.length; i += 2) ctx.lineTo(px(p[i + 1]), py(p[i])); };

    if (BM.sea) { trace(BM.sea); ctx.closePath(); ctx.fillStyle = C.water; ctx.fill();
      for (const p of BM.islands) { trace(p); ctx.closePath(); ctx.fillStyle = C.land; ctx.fill(); } }

    for (const f of pick(BM.rivers)) { if (f.w === 0 && z < 13) continue; ctx.lineWidth = f.w ? Math.max(1.5, Math.min(8, 2.5 * Math.pow(2, z - 14))) : 1.2; trace(f.pts); ctx.stroke(); }
    if (z >= 11) { ctx.strokeStyle = C.rail; ctx.lineWidth = 1.3; ctx.setLineDash([5, 3]); for (const f of pick(BM.rail)) { trace(f.pts); ctx.stroke(); } ctx.setLineDash([]); }
    const f2 = Math.pow(2, z - 15), wid = c => Math.max([1.8, 1.4, 1, 0.5][c], Math.min([22, 18, 14, 11][c], [10, 9, 7, 5.5][c] * f2));
    const maxC = z >= 12 ? 3 : z >= 11 ? 2 : 1, list = pick(BM.roads).filter(r => r.c <= maxC);
    const fill = [C.highway, C.avenue, C.arterial, C.street], edge = [C.highwayEdge, C.avenueEdge, C.arterialEdge, C.streetEdge];
    for (const c of [3, 2, 1, 0]) { const rs = list.filter(r => r.c === c); if (!rs.length) continue; const w = wid(c);
      if (w > 1.1) { ctx.strokeStyle = edge[c]; ctx.lineWidth = w + (c === 3 ? 1 : 1.5); for (const r of rs) { trace(r.pts); ctx.stroke(); } }
      ctx.strokeStyle = w > 1.1 ? fill[c] : edge[c]; ctx.lineWidth = w; for (const r of rs) { trace(r.pts); ctx.stroke(); } }
    const lab = z >= 15 ? 3 : z >= 14 ? 2 : z >= 13 ? 1 : -1;
    if (lab >= 0) { ctx.font = `500 ${z >= 16 ? 12 : 11}px Roboto, Arial, "Segoe UI", sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      for (const r of list) { if (!r.n || r.c > lab) continue; const p = r.pts, tw = ctx.measureText(r.n).width; let best = null, bl = 0;
        for (let i = 2; i < p.length; i += 2) { const x1 = px(p[i - 1]), y1 = py(p[i - 2]), x2 = px(p[i + 1]), y2 = py(p[i]), mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
          if (mx < 10 || mx > S - 10 || my < 10 || my > S - 10) continue; const l = Math.hypot(x2 - x1, y2 - y1); if (l > bl) { bl = l; best = [x1, y1, x2, y2]; } }
        if (!best || bl < tw + 14) continue; let [x1, y1, x2, y2] = best; if (x2 < x1) [x1, y1, x2, y2] = [x2, y2, x1, y1];
        ctx.save(); ctx.translate((x1 + x2) / 2, (y1 + y2) / 2); ctx.rotate(Math.atan2(y2 - y1, x2 - x1));
        ctx.lineWidth = 3; ctx.strokeStyle = C.halo; ctx.strokeText(r.n, 0, 0); ctx.fillStyle = r.c <= 1 ? C.textStrong : C.text; ctx.fillText(r.n, 0, 0); ctx.restore(); } }
    return t;
  }
});
function addBasemap(map) {
  new StreetLayer({ maxZoom: 19, attribution: "Datos del mapa © OpenStreetMap" }).addTo(map);
  map.createPane("places"); map.getPane("places").style.zIndex = 450; map.getPane("places").style.pointerEvents = "none";
  const P = BASE.places.map(([n, la, lo, rk]) => ({ rk, m: L.marker([la, lo], { pane: "places", interactive: false, keyboard: false,
    icon: L.divIcon({ className: "place rk" + rk, html: `<span>${n.replace(/[&<>]/g, "")}</span>`, iconSize: [0, 0] }) }) }));
  const show = () => { const z = map.getZoom(); map.getContainer().style.setProperty("--ps", Math.max(0.75, Math.min(1.3, 0.75 + (z - 10) * 0.11)).toFixed(2)); const lim = z >= 15 ? 3 : z >= 14 ? 2 : z >= 12 ? 1 : 0;
    for (const p of P) { const on = p.rk <= lim && z < 17; if (on && !map.hasLayer(p.m)) p.m.addTo(map); else if (!on && map.hasLayer(p.m)) map.removeLayer(p.m); } };
  map.on("zoomend", show); show();
}

</script>
<script>
const DATA = /*DATA*/;
const VEND = /*VEND*/;
const DAYS=[["Lu","Lunes"],["Ma","Martes"],["Mi","Miércoles"],["Ju","Jueves"],["Vi","Viernes"]];
let day="Lu", hidden=new Set(), focus=null;
const map=L.map("map").setView([-34.76,-58.33],11);
addBasemap(map);
const layer=L.layerGroup().addTo(map);
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
// clientes distintos en la misma coordenada: se separan unos metros en el mapa para que se vean todos
const SPREAD={};(()=>{const g={};for(const r of DATA){const k=r.la.toFixed(5)+","+r.lo.toFixed(5);(g[k]=g[k]||[]).push(r)}for(const k in g){const a=g[k];if(a.length<2)continue;a.forEach((r,i)=>{const ang=2*Math.PI*i/a.length,d=0.00012*Math.max(1,a.length/6);SPREAD[r.c]=[r.la+d*Math.sin(ang),r.lo+d*Math.cos(ang)*1.2]})}})();
function pos(p){return SPREAD[p.c]||[p.la,p.lo]}
function byVend(d){const o={};for(const r of DATA){if(r.dia!==d)continue;(o[r.v]=o[r.v]||[]).push(r)}return o}
function renderTabs(){
  const tabs=document.getElementById("tabs");
  tabs.innerHTML=DAYS.map(([k,v])=>`<button class="tab ${k===day?"on":""}" data-d="${k}">${v}<small>${DATA.filter(r=>r.dia===k).length} clientes</small></button>`).join("");
  tabs.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{day=b.dataset.d;focus=null;draw()});
}
function draw(){
  renderTabs(); layer.clearLayers();
  const G=byVend(day), bounds=[];
  for(const v of VEND){const pts=G[v.id]; if(!pts||hidden.has(v.id)) continue; if(focus&&focus!==v.id) continue;
    for(const p of pts){bounds.push([p.la,p.lo]);
      const style=p.s==="revisar"?{color:"#d1242f",weight:3}:{color:"#fff",weight:1.5};
      L.circleMarker(pos(p),{radius:focus?8:6,fillColor:v.col,fillOpacity:.9,...style})
       .bindPopup(`<b>${esc(p.n)}</b><br>${esc(p.d)} · ${esc(p.l)}<br>Cód. ${esc(p.c)} · Vendedor ${v.id} ${esc(v.name)}<br>Horario: ${esc(p.h||"-")}${p.t?"<br>Tel: "+esc(p.t):""}${p.no?`<br><span style="color:${p.s==="revisar"?"#d1242f":"#555"}">${esc(p.no)}</span>`:""}<br><a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${p.la},${p.lo}">Ver en Google Maps</a>`)
       .bindTooltip(`${v.id} · ${esc(p.n)}`).addTo(layer);
    }}
  map.invalidateSize(); if(bounds.length) map.fitBounds(L.latLngBounds(bounds),{padding:[30,30],maxZoom:16,animate:false});
  side(G);
}
function side(G){
  const dn=DAYS.find(x=>x[0]===day)[1], vs=VEND.filter(v=>G[v.id]);
  const all=DATA.filter(r=>r.dia===day), rel=all.filter(r=>r.s==="reubicado").length, rev=all.filter(r=>r.s==="revisar").length;
  let h=`<div class="sum"><div class="kpi"><b>${vs.length}</b><span>vendedores</span></div><div class="kpi"><b>${all.length}</b><span>clientes</span></div><div class="kpi"><b>${rel}</b><span>reubicados</span></div></div>`;
  if(focus){const v=VEND.find(x=>x.id===focus), pts=G[focus].slice().sort((a,b)=>a.l.localeCompare(b.l)||a.d.localeCompare(b.d));
    h+=`<button class="btn" id="bBack">← Todos los vendedores</button><h3>Vendedor ${v.id} · ${esc(v.name)} — ${pts.length} clientes (${dn})</h3><ol class="seq">`+
      pts.map((p,i)=>`<li data-c="${esc(p.c)}"><span class="n" style="background:${v.col}"></span><span>${esc(p.n)}<br><small>${esc(p.d)} · ${esc(p.l)}${p.h?" · "+esc(p.h):""}</small>${p.s!=="ok"?`<br><small class="${p.s==="revisar"?"warn":""}">${p.s==="revisar"?"⚠ Revisar ubicación":"★ Reubicado"}</small>`:""}</span></li>`).join("")+`</ol>`;
  } else {
    h+=`<h3>Vendedores del ${dn}</h3>`+vs.map(v=>{const p=G[v.id], nr=p.filter(x=>x.s==="revisar").length;
      return `<div class="vrow" data-v="${v.id}"><input type="checkbox" ${hidden.has(v.id)?"":"checked"} data-c="${v.id}"><span class="sw" style="background:${v.col}"></span><span><b>${v.id}</b> ${esc(v.name)}</span><span class="meta">${p.length} clientes${nr?` · <span class="warn">${nr}⚠</span>`:""}</span></div>`}).join("");
    h+=`<div class="hint">Clic en un vendedor para ver solo sus clientes. Tildá/destildá para mostrar u ocultar.</div>`;
  }
  h+=`<div class="legend"><span><i style="border:2px solid #fff;box-shadow:0 0 0 1px #999"></i>Cliente</span><span><i style="border:3px solid #d1242f"></i>Revisar (dirección no encontrada o dudosa)</span><span>${rev} a revisar este día</span></div>`;
  const s=document.getElementById("side"); s.innerHTML=h;
  s.querySelectorAll("input[data-c]").forEach(c=>{c.onclick=e=>{e.stopPropagation();const id=+c.dataset.c;c.checked?hidden.delete(id):hidden.add(id);draw()}});
  s.querySelectorAll(".vrow").forEach(r=>r.onclick=()=>{focus=+r.dataset.v;draw()});
  const bb=document.getElementById("bBack"); if(bb) bb.onclick=()=>{focus=null;draw()};
  s.querySelectorAll("ol.seq li").forEach(li=>li.onclick=()=>{const p=DATA.find(r=>r.c===li.dataset.c&&r.dia===day&&r.v===focus);const q=pos(p);map.setView(q,17);
    layer.eachLayer(l=>{if(l.getLatLng&&l.getPopup&&l.getPopup()){const g=l.getLatLng();if(g.lat===q[0]&&g.lng===q[1])l.openPopup()}})});
}
document.getElementById("bAll").onclick=()=>{if(hidden.size)hidden.clear();else VEND.forEach(v=>hidden.add(v.id));focus=null;draw()};
// ---- Buscar por cliente (nombre o código) y por dirección ----
const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const IDX=DATA.map(r=>({r,k:norm(r.n+" "+r.c+" "+r.d+" "+r.l)}));
const DN=Object.fromEntries(DAYS);
let marca=null, pinDir=null;
function resaltar(lat,lng){ if(marca) map.removeLayer(marca); marca=L.marker([lat,lng],{interactive:false,icon:L.divIcon({className:"",html:'<div class="pulso" style="width:34px;height:34px"></div>',iconSize:[34,34],iconAnchor:[17,17]})}).addTo(map); }
function irACliente(p){
  day=p.dia; focus=null; hidden.delete(p.v); draw();
  const q=pos(p); map.setView(q,17,{animate:false}); resaltar(q[0],q[1]);
  layer.eachLayer(l=>{ if(l.getLatLng&&l.getPopup&&l.getPopup()){ const g=l.getLatLng(); if(g.lat===q[0]&&g.lng===q[1]) l.openPopup(); } });
}
async function buscarDireccion(txt){
  const ul=document.getElementById("res"); const li=ul.querySelector(".dir-li"); if(li) li.innerHTML='<span></span><span><small>Buscando la dirección…</small></span>';
  try{
    const u="https://photon.komoot.io/api/?limit=1&lang=es&bbox=-58.95,-35.25,-57.95,-34.45&q="+encodeURIComponent(txt+", Buenos Aires");
    const j=await (await fetch(u)).json(); const f=j.features&&j.features[0];
    if(!f){ if(li) li.innerHTML='<span></span><span><small>No se encontró esa dirección en el mapa.</small></span>'; return; }
    const [lo,la]=f.geometry.coordinates, p=f.properties, nom=[p.street||p.name,p.housenumber].filter(Boolean).join(" ")+", "+(p.city||p.district||p.county||"");
    if(pinDir) map.removeLayer(pinDir);
    pinDir=L.marker([la,lo]).bindPopup("<b>"+esc(nom)+"</b><br><small>Dirección buscada</small>").addTo(map).openPopup();
    map.setView([la,lo],17,{animate:false}); resaltar(la,lo);
    if(li) li.innerHTML='<span></span><span class="dir">📍 '+esc(nom)+'</span>';
  }catch(e){ if(li) li.innerHTML='<span></span><span><small>No se pudo buscar la dirección (revisá la conexión a internet).</small></span>'; }
}
function mostrarResultados(){
  const txt=document.getElementById("q").value, t=norm(txt), ul=document.getElementById("res");
  if(t.length<2){ ul.innerHTML=""; return; }
  const ws=t.split(" "); const hits=IDX.filter(x=>ws.every(w=>x.k.includes(w))).slice(0,40);
  let h=hits.map((x,i)=>{const p=x.r,v=VEND.find(z=>z.id===p.v);return `<li tabindex="0" data-i="${DATA.indexOf(p)}"><span class="sw" style="background:${v.col}"></span><span><b>${esc(p.n)}</b> <small>· cód. ${esc(p.c)}</small><br><small>${esc(p.d)} · ${esc(p.l)}<br>${DN[p.dia]} · vendedor ${v.id} ${esc(v.name)}</small></span></li>`}).join("");
  if(!hits.length) h='<span class="vacio">Ningún cliente coincide.</span>';
  if(/\d/.test(txt)||!hits.length) h+=`<li tabindex="0" class="dir-li"><span></span><span class="dir">📍 Buscar «${esc(txt)}» como dirección en el mapa</span></li>`;
  ul.innerHTML=h;
  ul.querySelectorAll("li").forEach(li=>{ const go=()=>{ if(li.classList.contains("dir-li")) buscarDireccion(txt); else irACliente(DATA[+li.dataset.i]); };
    li.onclick=go; li.onkeydown=e=>{ if(e.key==="Enter") go(); }; });
}
document.getElementById("q").addEventListener("input",mostrarResultados);
document.getElementById("q").addEventListener("keydown",e=>{ if(e.key==="Enter"){ const f=document.querySelector("#res li"); if(f) f.click(); } });

draw();
</script>
</body>
